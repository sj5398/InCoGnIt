<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>
    <style>
        /* Quita los márgenes blancos que los navegadores ponen por defecto */
        body {
            margin: 0;
            padding: 0;
        }

        /* Configura el header y la imagen para ocupar todo el ancho */
        header {
            width: 100%;
            height: 300px; /* Mantiene la altura de 150px que querías */
            overflow: hidden; /* Evita que la imagen se salga del contenedor */
        }

        header img {
            width: 100%; /* Ocupa todo el largo de la pantalla */
            height: 100%; /* Mantiene los 150px de alto */
            object-fit: cover; /* Ajusta la imagen para que no se deforme ni se estire feo */
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <img src="unnamed.png" alt="cigarra">
    </header>

    <main>
        <!-- Tu contenido aquí -->
    </main>

</body>
</html>
